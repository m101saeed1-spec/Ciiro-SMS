<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ileys — Smarter School Management for a Brighter Future</title>
    <meta name="description" content="Ileys is a modern, comprehensive school management platform connecting schools, administrators, teachers, accountants, and students." />
    <meta property="og:title" content="Ileys — School Management Platform" />
    <meta property="og:description" content="Ileys helps schools manage operations, people, academic information, and administration from one organized platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ileys_theme_mode') || localStorage.getItem('eduspike_theme');
          var isDark = saved === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F9FC] dark:bg-[#0B1B32] text-[#12233F] dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
